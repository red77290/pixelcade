name: Update Marquee Catalog

on:
  push:
    branches:
      - master
    paths-ignore:
      - "_catalog/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate _catalog manifests
        run: python3 scripts/generate_catalog.py

      - name: Commit updated catalog if changed
        run: |
          git status --porcelain _catalog
          if [ -n "$(git status --porcelain _catalog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _catalog
            git commit -m "chore(catalog): refresh _catalog marquee manifests"
            git push origin HEAD:master
          fi
